<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WH-MURTEDE LOGISTICS - V95 TOTAL CONTROL</title>

    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --packing: #28a745;
            --picking: #8e44ad;
            --returns: #ff3d00;
            --refunds: #f59e0b;
            --error: #e74c3c;
            --bg: #f4f7f6;
            --color-ctt: #2ecc71;
            --color-nacex: #9b59b6;
            --color-correos: #3498db;
            --color-printed: #ff851b;
            --color-ready: #28a745;
            --color-packed: #0056b3;
            --color-prepack: #16a085;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
            margin: 0;
            color: #333;
            overflow-x: hidden;
            font-size: 16px;
        }

        
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--primary);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5000;
            color: white;
        }

        .login-card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 380px;
            color: #333;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .login-card input {
            width: 100%;
            padding: 15px;
            margin: 12px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 18px;
            box-sizing: border-box;
        }

        
        .nav-bar {
            background: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 30px;
            border-bottom: 3px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 1000;
            height: 80px;
        }

        .nav-item {
            padding: 25px 15px;
            cursor: pointer;
            font-weight: 900;
            color: #7f8c8d;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        .nav-item.active {
            color: var(--accent);
            border-bottom: 5px solid var(--accent);
        }

        .container {
            max-width: 1800px;
            margin: 25px auto;
            padding: 0 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.08);
            margin-bottom: 25px;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .dash-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            border-bottom: 5px solid #ddd;
        }

        .dash-card h2 {
            font-size: 48px;
            margin: 0;
            color: var(--primary);
        }

        .dash-card p {
            margin: 10px 0 0;
            font-weight: 900;
            text-transform: uppercase;
            font-size: 14px;
            color: #7f8c8d;
        }

        
        .mgmt-wrapper {
            display: flex;
            gap: 30px;
            overflow-x: auto;
            padding-bottom: 30px;
            align-items: flex-start;
        }

        .carrier-column {
            min-width: 380px;
            max-width: 380px;
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 20px;
            padding: 15px;
        }

        .carrier-header {
            border-radius: 12px;
            color: white;
            padding: 15px;
            font-weight: 900;
            font-size: 18px;
            text-align: center;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        .batch-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.02);
        }

        .progress-container {
            background: #eee;
            border-radius: 10px;
            height: 8px;
            margin: 12px 0;
            overflow: hidden;
        }

        .progress-bar {
            background: var(--packing);
            height: 100%;
            transition: width 0.5s;
        }

        
        .btn-mobile-op {
            width: 100%;
            padding: 20px;
            font-size: 18px;
            font-weight: 900;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            text-transform: uppercase;
            transition: 0.2s;
            margin-bottom: 10px;
        }

        .btn-op-green {
            background: var(--packing);
        }

        .btn-op-purple {
            background: var(--picking);
        }

        .btn-op-orange {
            background: var(--returns);
        }

        .btn-submit {
            background: var(--packing);
            color: white;
            width: 100%;
            font-size: 18px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-small {
            padding: 8px 12px;
            font-size: 11px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        .btn-delete {
            background: var(--error) !important;
        }

        .btn-dismiss {
            background: #fff;
            color: var(--error);
            border: 2px solid var(--error);
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 900;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
        }

        
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 6000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            padding: 40px;
            border-radius: 25px;
            width: 95%;
            max-width: 1500px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
        }

        .scroll-area {
            max-height: 450px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: #fff;
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table th {
            background: #f1f3f5;
            position: sticky;
            top: 0;
            z-index: 10;
            padding: 12px;
            border-bottom: 2px solid #dee2e6;
            text-align: left;
        }

        table td {
            padding: 12px;
            border-bottom: 1px solid #eee;
        }

        .prod-tag {
            background: #eee;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 4px;
            font-size: 14px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 1px solid #ccc;
        }

        .meta-cancel-banner {
            background: #e74c3c;
            color: white;
            padding: 20px;
            border-radius: 12px;
            font-weight: 900;
            text-align: center;
            margin-bottom: 20px;
            font-size: 28px;
            animation: blink 1s infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media(max-width: 900px) {
            .grid-3 {
                grid-template-columns: 1fr;
            }
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .location-tag {
            background: #fee2e2;
            color: #991b1b;
            padding: 5px 12px;
            border-radius: 8px;
            font-weight: 900;
            font-size: 20px;
            margin-left: auto;
            border: 1px solid #f87171;
        }

        
        .cancelled-id {
            color: var(--error);
            font-weight: 900;
            text-decoration: line-through;
            text-decoration-color: var(--error);
            text-decoration-thickness: 3px;
        }

        .cancelled-row {
            background: #fff5f5;
        }

        
        .partial-return-banner {
            display: none;
            background: linear-gradient(135deg, #fff7ed, #fef3c7);
            border: 3px solid #f59e0b;
            border-radius: 14px;
            padding: 16px 20px;
            margin-bottom: 14px;
            animation: partialPulse 2s ease-in-out infinite;
        }

        @keyframes partialPulse {

            0%,
            100% {
                border-color: #f59e0b;
            }

            50% {
                border-color: #ef4444;
            }
        }

        .partial-return-banner .pbanner-title {
            font-size: 18px;
            font-weight: 900;
            color: #92400e;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 10px;
        }

        .partial-return-banner .pbanner-prev-label {
            font-size: 12px;
            font-weight: 900;
            color: #92400e;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .partial-return-banner .pbanner-prods {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-bottom: 8px;
        }

        .partial-return-banner .pbanner-prod-tag {
            background: #fde68a;
            color: #78350f;
            border: 1px solid #fbbf24;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 700;
        }

        .partial-return-banner .pbanner-prod-tag.new {
            background: #d1fae5;
            color: #065f46;
            border-color: #6ee7b7;
        }

        .partial-return-banner .pbanner-prod-tag.combined {
            background: #ede9fe;
            color: #4c1d95;
            border-color: #c4b5fd;
        }

        .partial-return-banner .pbanner-summary {
            font-size: 13px;
            color: #78350f;
            margin-top: 6px;
            font-weight: 700;
        }

        .partial-return-banner .pbanner-times {
            font-size: 11px;
            color: #b45309;
            margin-top: 4px;
        }

        
        .packing-guide-card {
            margin: 0 0 16px 0;
            border: 3px solid var(--accent);
            border-radius: 16px;
            background: #eff6ff;
            padding: 18px 20px;
            text-align: left;
            box-shadow: 0 6px 14px rgba(52, 152, 219, .12);
        }

        .packing-guide-title {
            font-size: 30px;
            line-height: 1.1;
            font-weight: 1000;
            color: #1d4ed8;
            text-transform: uppercase;
            letter-spacing: .5px;
        }

        .packing-guide-detail {
            margin-top: 8px;
            font-size: 18px;
            line-height: 1.35;
            font-weight: 800;
            color: #334155;
        }

        .packing-guide-card.ok {
            background: #f0fdf4;
            border-color: #22c55e;
        }

        .packing-guide-card.ok .packing-guide-title {
            color: #166534;
        }

        .packing-guide-card.warn {
            background: #fffbeb;
            border-color: #f59e0b;
        }

        .packing-guide-card.warn .packing-guide-title {
            color: #92400e;
        }

        .packing-guide-card.bad {
            background: #fef2f2;
            border-color: #ef4444;
        }

        .packing-guide-card.bad .packing-guide-title {
            color: #991b1b;
        }

        .packing-guide-card.done {
            background: #ecfdf5;
            border-color: #10b981;
        }

        .packing-guide-card.done .packing-guide-title {
            color: #047857;
        }

        .packing-mini-progress {
            margin-top: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .packing-mini-pill {
            display: inline-flex;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 900;
            text-transform: uppercase;
            background: #fff;
            border: 1px solid #cbd5e1;
            color: #334155;
        }

        
        @media (max-width: 768px) {
            .nav-bar {
                padding: 0 8px;
                height: auto;
                flex-wrap: wrap;
                min-height: 56px;
            }
            #menu-items {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                flex-wrap: nowrap;
                width: 100%;
                padding-bottom: 4px;
            }
            .nav-item {
                padding: 14px 8px;
                font-size: 10px;
                white-space: nowrap;
                flex-shrink: 0;
            }
            .container {
                padding: 0 8px;
                margin: 8px auto;
            }
            .dashboard-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
            .grid-2 {
                grid-template-columns: 1fr !important;
                gap: 15px;
            }
            .grid-3 {
                grid-template-columns: 1fr !important;
                gap: 10px;
            }
            .card { padding: 15px; }
            .modal-content {
                padding: 18px;
                width: 98%;
            }
            .login-card { width: 95%; padding: 22px; }
            .mgmt-wrapper { flex-direction: column; }
            .carrier-column { min-width: 100%; max-width: 100%; }
            table { font-size: 12px; }
            table td, table th { padding: 7px 5px; }
            input, textarea, select { font-size: 16px !important; }
            #main-input, #return-input, #refund-input, #prepack-input {
                font-size: 26px !important;
                height: 70px !important;
            }
            .btn-mobile-op { font-size: 15px; padding: 15px; }
            .packing-guide-title { font-size: 20px; }
            .packing-guide-detail { font-size: 14px; }
            .dash-card h2 { font-size: 34px; }
            #sec-warehouse .grid-2 { grid-template-columns: 1fr !important; }
            .lang-flags { gap: 4px; }
            .lang-flag-btn { font-size: 20px !important; padding: 2px 3px !important; }
            #__topbar { flex-wrap: wrap; gap: 6px; }
        }
        @media (max-width: 480px) {
            .dash-card h2 { font-size: 26px; }
            .dash-card p { font-size: 11px; }
        }

    </style>
</head>

<body>

    <div id="login-screen">
        <h1>WH-MURTEDE</h1>
        <div class="login-card">
            <input type="email" id="login-email" placeholder="Email (@admin.com / @wh.com)">
            <input type="password" id="login-pass" placeholder="Senha" data-i18n-placeholder="login_pass">
            <button
                style="width:100%; background:var(--accent); color:white; border:none; padding:20px; border-radius:12px; cursor:pointer; font-weight:bold; font-size:20px;"
                onclick="handleLogin()" data-i18n="SIGN_IN">ENTRAR</button>
        </div>
    </div>

    
    <div id="volumes-alert-modal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75); z-index:9000; justify-content:center; align-items:center; padding:20px;">
        <div
            style="background:white; border-radius:25px; width:100%; max-width:480px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.5); text-align:center;">
            <div style="background:#f59e0b; padding:30px 20px;">
                <div style="font-size:60px;">📦</div>
                <div style="font-size:32px; font-weight:900; color:white; margin-top:10px;" id="volumes-alert-title">
                    ATENÇÃO</div>
            </div>
            <div style="padding:30px 25px;">
                <div id="volumes-alert-msg" style="font-size:22px; font-weight:700; color:#1e293b; line-height:1.4;">
                </div>
                <button
                    onclick="document.getElementById('volumes-alert-modal').style.display='none'; document.getElementById('main-input').focus();"
                    style="margin-top:30px; width:100%; padding:25px; font-size:24px; font-weight:900; background:#f59e0b; color:white; border:none; border-radius:15px; cursor:pointer; text-transform:uppercase; letter-spacing:1px;">
                    OK, ENTENDIDO
                </button>
            </div>
        </div>
    </div>

    
    <div id="packing-complete-modal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.82); z-index:9500; justify-content:center; align-items:center; padding:18px;">
        <div
            style="background:white; border-radius:28px; width:100%; max-width:560px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,0.55); text-align:center; border:6px solid #22c55e;">
            <div style="background:#22c55e; padding:34px 20px; color:white;">
                <div style="font-size:72px; line-height:1;">✅</div>
                <div
                    style="font-size:48px; font-weight:1000; margin-top:12px; text-transform:uppercase; letter-spacing:1px; line-height:1.05;">
                    LOTE COMPLETO</div>
            </div>
            <div style="padding:34px 24px;">
                <div id="packing-complete-batch-name"
                    style="font-size:22px; font-weight:900; color:#334155; margin-bottom:18px; word-break:break-word;">
                </div>
                <div
                    style="font-size:42px; line-height:1.08; font-weight:1000; color:#1d4ed8; text-transform:uppercase; margin-bottom:10px;">
                    SELECIONAR<br>NOVO LOTE
                </div>
                <div style="font-size:20px; line-height:1.35; font-weight:800; color:#475569; margin-top:12px;">
                    Todos os IDs deste lote foram concluídos. Escolhe outro lote para continuar o Packing.
                </div>
                <button onclick="closePackingCompleteModal()"
                    style="margin-top:30px; width:100%; padding:28px 20px; font-size:30px; font-weight:1000; background:#1d4ed8; color:white; border:none; border-radius:18px; cursor:pointer; text-transform:uppercase; letter-spacing:1px;">
                    OK, SELECIONAR LOTE
                </button>
            </div>
        </div>
    </div>

    
    <div id="packing-error-modal"
        style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.78); z-index:9400; justify-content:center; align-items:center; padding:18px;">
        <div
            style="background:white; border-radius:26px; width:100%; max-width:560px; overflow:hidden; box-shadow:0 24px 80px rgba(0,0,0,0.55); text-align:center; border:6px solid #ef4444;">
            <div id="packing-error-head" style="background:#ef4444; padding:30px 20px; color:white;">
                <div id="packing-error-icon" style="font-size:70px; line-height:1;">⛔</div>
                <div id="packing-error-title"
                    style="font-size:38px; font-weight:1000; margin-top:12px; text-transform:uppercase; letter-spacing:1px; line-height:1.08;">
                    ERRO NO PACKING</div>
            </div>
            <div style="padding:30px 24px;">
                <div id="packing-error-message"
                    style="font-size:23px; font-weight:900; color:#1e293b; line-height:1.35; white-space:pre-wrap; text-align:left;">
                </div>
                <div id="packing-error-action"
                    style="margin-top:20px; padding:18px; background:#fef2f2; border:2px solid #fecaca; border-radius:16px; font-size:21px; line-height:1.35; font-weight:1000; color:#991b1b; text-transform:uppercase; text-align:center;">
                </div>
                <button onclick="closePackingErrorModal()"
                    style="margin-top:28px; width:100%; padding:26px 20px; font-size:28px; font-weight:1000; background:#ef4444; color:white; border:none; border-radius:18px; cursor:pointer; text-transform:uppercase; letter-spacing:1px;">
                    OK, CORRIGIR
                </button>
            </div>
        </div>
    </div>

    
    <div id="edit-batch-modal" class="modal">
        <div class="modal-content">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="edit-batch-title" style="font-size:30px; margin:0;"></h2>
                <button class="btn-small btn-delete" id="modal-delete-btn"
                    style="padding:15px 30px; font-size:16px;" data-i18n="DELETE_BATCH">APAGAR LOTE INTEIRO</button>
            </div>
            <div id="edit-batch-meta" style="margin-top:10px; font-size:14px; color:#444;"></div>
            <hr style="margin:25px 0;">
            <div style="display:grid; grid-template-columns: 1fr 1.5fr; gap:30px;">
                <div>
                    <h4 data-i18n="INVENTORY_STATUS">📦 Estado do Inventário</h4>
                    <div class="scroll-area">
                        <table id="edit-inventory-table">
                            <thead>
                                <tr id="inv-header">
                                    <th data-i18n="PRODUCT_TH">Produto</th>
                                    <th data-i18n="QTY_TH">Qtd</th>
                                    <th data-i18n="POS_TH">Pos</th>
                                    <th class="admin-only-cell" data-i18n="DEL_TH">Apag</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <h4 data-i18n="MOD_LOG">📊 Registo de Modificações</h4>
                    <div id="qty-modification-log"
                        style="font-size:11px; background:#f8f9fa; padding:10px; border-radius:10px; height:200px; overflow-y:auto; border:1px solid #ddd; font-family: monospace;">
                    </div>
                </div>
                <div>
                    <h4 data-i18n="ORDER_TRACKING">🆔 Mapeamento de Encomendas</h4>
                    <div class="scroll-area" id="edit-ids-list"></div>
                    <h4 style="margin-top:20px; color: var(--error);" data-i18n="CANCEL_LOG">🚫 Registo de Cancelamentos</h4>
                    <div id="cancelled-ids-log"
                        style="font-size:11px; background:#fff5f5; padding:10px; border-radius:10px; height:150px; overflow-y:auto; border:1px solid #fab1a0; font-family: monospace;">
                    </div>
                </div>
            </div>
            <button class="btn-submit" style="margin-top:35px; background: var(--primary);"
                onclick="closeModal('edit-batch-modal')" data-i18n="CLOSE_WINDOW">FECHAR JANELA</button>
        </div>
    </div>

    
    <div id="id-history-modal" class="modal">

        function whSheetsAggregateProducts(prodsValue) {
            const list = Array.isArray(prodsValue)
                ? prodsValue
                : String(prodsValue || '').split('|');
            const counts = {};
            list.map(x => String(x || '').trim()).filter(Boolean).forEach(p => {
                if (!p || p === 'No Items') return;
                const k = p.toUpperCase();
                counts[k] = (counts[k] || 0) + 1;
            });
            return Object.entries(counts).map(([product, qty]) => ({ product, qty }));
        }

        async function whSheetsPost(payload) {
            if (!whSheetsConfigured()) return { ok: false, skipped: true, reason: 'No WH_SHEETS_WEB_APP_URL' };
            try {
                await fetch(window.WH_SHEETS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload)
                });
                return { ok: true };
            } catch (err) {
                console.warn('Google Sheets sync failed:', err);
                return { ok: false, error: err };
            }
        }

        function whSheetsShouldSkipReturnRefundSync(record) {
            if (!record) return false;
            const mode = record.mode || currentMode;
            if (!_isRefundMode(mode)) return false;

            const status = String(record.returnStatus || '').trim().toUpperCase();
            const reason = String(record.refundReason || '').trim().toUpperCase();

            
            
            if (record.specialNoTracking === true || record.specialCloseWithProducts !== undefined || reason) return true;

            return status === 'SWIPE' ||
                status === 'NO_PRODUCT' ||
                status === 'PRODUCT_DAMAGED' ||
                status === 'BOX_DAMAGED' ||
                status === 'NO_PRODUCT_DAMAGED' ||
                reason === 'SWIPE' ||
                reason === 'SEM PRODUTO' ||
                reason === 'PRODUTO DANIFICADO' ||
                reason === 'CAIXA DANIFICADA' ||
                reason === 'SEM PRODUTO/PRODUTO DANIFICADO';
        }

        async function whSheetsSendReturnRefundRecord(regKey, record) {
            if (!record || !regKey) return;
            const mode = record.mode || currentMode;
            if (!_isReturnMode(mode) && !_isRefundMode(mode)) return;
            if (whSheetsShouldSkipReturnRefundSync(record)) {
                console.log('Google Sheets sync skipped for special refund:', record.returnStatus || record.refundReason || regKey);
                return { ok: false, skipped: true, reason: 'Special refund not synced to Sheets' };
            }
            const rows = whSheetsAggregateProducts(record.prods);
            if (!rows.length) return;
            const type = _isRefundMode(mode) ? 'refund' : 'return';
            await whSheetsPost({
                type: type,
                source_key: 'WH_REG_' + regKey,
                date: record.dateClean || record.workDateClean || _nowDateClean(),
                rows: rows
            });
        }

        async function exportData(type) {
            const start = document.getElementById('rep-start-date').value;
            const end = document.getElementById('rep-end-date').value;
            const dataToExport = [];

            
            const inRange = (d) => (d && d >= start && d <= end);

            if (type === 'ACTIVITY') {
                const snap = await db.ref('registos').once('value');
                const batchSnap = await db.ref('active_batches').once('value');
                const batches = batchSnap.val() || {};

                Object.values(snap.val() || {}).forEach(r => {
                    if (inRange(r.dateClean)) {
                        const carrier = (batches[r.batch] && batches[r.batch].carrier) ? batches[r.batch].carrier : "N/A";
                        dataToExport.push({
                            Date: r.dateClean,
                            Start_Time: r.startTime || r.time,
                            End_Time: r.endTime || r.time,
                            ID: r.id,
                            Mode: r.mode,
                            User: r.user,
                            Tracking: r.track,
                            Items: r.prods,
                            Carrier: carrier,
                            Batch_Key: r.batch || "GENERAL",
                            Batch_Name: (batches[r.batch] && batches[r.batch].name) ? batches[r.batch].name : "GENERAL"
                        });
                    }
                });

            } else if (type === 'CARRIERS') {
                
                
                const [batchSnap, regSnap] = await Promise.all([
                    db.ref('active_batches').once('value'),
                    db.ref('registos').once('value')
                ]);

                const batches = batchSnap.val() || {};
                const registos = regSnap.val() || {};

                
                const packIndex = {};
                Object.values(registos).forEach(r => {
                    if (r && r.mode === 'PACKING' && r.batch && r.id) {
                        if (!packIndex[r.batch]) packIndex[r.batch] = {};
                        const prev = packIndex[r.batch][r.id];
                        
                        const curKey = (r.dateClean || "") + " " + (r.endTime || r.time || "");
                        const prevKey = prev ? ((prev.dateClean || "") + " " + (prev.endTime || prev.time || "")) : "";
                        if (!prev || curKey > prevKey) packIndex[r.batch][r.id] = r;
                    }
                });

                Object.entries(batches).forEach(([batchKey, b]) => {
                    if (!b || !inRange(b.dateClean)) return;

                    const batchName = b.name || batchKey;
                    const carrier = b.carrier || "N/A";
                    const expected = b.expected_ids || [];
                    const orderDetails = b.order_details || {};
                    const cancelled = b.cancelled_ids || {};

                    expected.forEach(orderId => {
                        const det = orderDetails[orderId] || {};
                        const cancelInfo = cancelled[orderId] || null;
                        const packRec = (packIndex[batchKey] && packIndex[batchKey][orderId]) ? packIndex[batchKey][orderId] : null;

                        
                        let status = "PENDING";
                        if (cancelInfo) status = "CANCELLED";
                        else if (packRec) status = "PACKED";

                        dataToExport.push({
                            Batch_Key: batchKey,
                            Batch_Name: batchName,
                            Carrier: carrier,
                            Batch_Date: b.dateClean || "",
                            Order_ID: orderId,
                            Customer: det.name || "",
                            Expected_Content: det.content || "",
                            Status: status,
                            Cancel_Reason: cancelInfo ? (cancelInfo.reason || "") : "",
                            Cancelled_By: cancelInfo ? (cancelInfo.user || "") : "",
                            Cancelled_At: cancelInfo ? (_normalizeDT(cancelInfo.DateTime || (cancelInfo.dateClean && cancelInfo.time ? _dtKey(cancelInfo.dateClean, cancelInfo.time) : cancelInfo.time), (b.dateClean || "")) || "") : "",
                            Packed_By: packRec ? (packRec.user || "") : "",
                            Packed_Date: packRec ? (packRec.dateClean || "") : "",
                            Packed_Start_Time: packRec ? (packRec.startTime || "") : "",
                            Packed_Confirmed_Time: packRec ? (packRec.endTime || packRec.time || "") : "",
                            Tracking: packRec ? (packRec.track || "") : "",
                            Packed_Items: packRec ? (packRec.prods || "") : ""
                        });
                    });
                });

            } else if (type === 'PREPACK') {
                const snap = await db.ref('pre_packing').once('value');
                Object.values(snap.val() || {}).forEach(p => {
                    if (inRange(p.dateClean)) {
                        dataToExport.push({ Date: p.dateClean, Time: p.time, User: p.user, Product: p.product });
                    }
                });
            }

            if (dataToExport.length === 0) return alert("No data found for these dates.");
            const ws = XLSX.utils.json_to_sheet(dataToExport);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "Report");
            XLSX.writeFile(wb, `WH_Export_${type}_${start}_to_${end}.xlsx`);
        }

        
        function _normName(s) {
            return String(s || "").trim().replace(/\s+/g, ' ').toUpperCase();
        }

        function parseExpectedContent(contentStr) {
            
            
            
            const out = {};
            const raw = String(contentStr || "").trim();
            if (!raw) return out;

            
            const parts = raw.split(/\s*(\||;|,)\s*/).filter(x => x && x !== '|' && x !== ';' && x !== ',');
            parts.forEach(seg => {
                const s = String(seg || "").trim();
                if (!s) return;

                
                const m = s.match(/^(.*?)(?:\s*x\s*|\s+)(\d+)\s*$/i);
                if (!m) return;

                const name = _normName(m[1]);
                const qty = parseInt(m[2], 10) || 0;
                if (!name || qty <= 0) return;
                out[name] = (out[name] || 0) + qty;
            });

            return out;
        }

        function countScannedProds(prodsArr) {
            const c = {};
            (prodsArr || []).forEach(p => {
                const k = _normName(p);
                if (!k) return;
                c[k] = (c[k] || 0) + 1;
            });
            return c;
        }

        function packingMeetsExpected() {
            
            if (!activeBatchData || !activeBatchData.order_details || !scanData.id) {
                return { ok: true, missing: [], extra: [] };
            }

            const det = activeBatchData.order_details[scanData.id] || {};
            const expected = parseExpectedContent(det.content || "");
            const expKeys = Object.keys(expected);

            if (expKeys.length === 0) {
                return { ok: true, missing: [], extra: [], expected: expected };
            }

            const scanned = countScannedProds(scanData.prods);

            const missing = [];
            expKeys.forEach(prod => {
                const need = expected[prod];
                const got = scanned[prod] || 0;
                if (got < need) missing.push(`${prod} (${got}/${need})`);
            });

            
            
            const extra = [];
            Object.keys(scanned).forEach(prod => {
                const got = scanned[prod] || 0;
                const need = expected[prod] || 0;
                if (got > need) extra.push(`${prod} (${got}/${need})`);
            });

            return { ok: missing.length === 0 && extra.length === 0, missing: missing, extra: extra, expected: expected, scanned: scanned };
        }

        function getPackingRequiredVolumes() {
            const raw = (activeBatchData && activeBatchData.order_volumes && scanData.id && activeBatchData.order_volumes[scanData.id]) || 1;
            const n = parseInt(raw, 10);
            return Math.max(1, isNaN(n) ? 1 : n);
        }

        function getPackingScannedVolumes() {
            return (scanData.tracks && scanData.tracks.length) || (scanData.track ? 1 : 0);
        }

        function getPackingExpectedIdCount() {
            return activeBatchData ? getRequiredBatchIds(activeBatchData).length : 0;
        }

        function getPackingDoneIdCount(extraId) {
            if (!activeBatchData) return 0;
            const requiredIds = getRequiredBatchIds(activeBatchData);
            const processedMap = Object.assign({}, activeBatchData.processed_ids || {});
            if (extraId) processedMap[extraId] = true;
            return requiredIds.filter(id => processedMap[id]).length;
        }

        function packingCurrentIdIsCancelled() {
            return !!(activeBatchData && scanData.id && activeBatchData.cancelled_ids && activeBatchData.cancelled_ids[scanData.id]);
        }

        function packingIdBelongsToBatch(id) {
            if (!activeBatchData || !id) return false;
            const ids = activeBatchData.expected_ids || [];
            return ids.includes(id);
        }

        function packingEscapeHtml(v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function showPackingProductError(chk, reason) {
            const missing = (chk && chk.missing && chk.missing.length) ? chk.missing : [];
            const extra = (chk && chk.extra && chk.extra.length) ? chk.extra : [];
            let msg = '';
            if (scanData && scanData.id) msg += 'ID: ' + scanData.id + '\n\n';
            if (extra.length) msg += 'Produto a mais / diferente:\n- ' + extra.join('\n- ') + '\n\n';
            if (missing.length) msg += 'Produto em falta:\n- ' + missing.join('\n- ') + '\n\n';
            const title = extra.length ? 'PRODUTO ERRADO' : 'FALTAM PRODUTOS';
            const action = extra.length
                ? 'Remover o produto errado no botão × e voltar a picar corretamente'
                : 'Picar os produtos em falta antes do tracking';
            showPackingErrorModal(title, msg.trim(), action, extra.length ? 'bad' : 'warn');
        }

        function setPackingGuide(kind, title, detail, pills) {
            const box = document.getElementById('packing-step-guide');
            const t = document.getElementById('packing-step-title');
            const d = document.getElementById('packing-step-detail');
            const p = document.getElementById('packing-step-progress');
            if (box) {
                box.className = 'packing-guide-card' + (kind ? (' ' + kind) : '');
            }
            if (t) t.innerHTML = title || '';
            if (d) d.innerHTML = detail || '';
            if (p) {
                const items = Array.isArray(pills) ? pills : [];
                p.innerHTML = items.map(x => `<span class="packing-mini-pill">${x}</span>`).join('');
            }
        }

        function updatePackingGuidance() {
            if ((currentMode || '') !== 'PACKING') return;
            const inp = document.getElementById('main-input');
            const batchId = document.getElementById('wh-batch-select') ? document.getElementById('wh-batch-select').value : '';
            const total = getPackingExpectedIdCount();
            const done = getPackingDoneIdCount();
            const batchPill = total ? [`Lote: ${done}/${total} IDs completos`] : [];

            if (!batchId || !activeBatchData) {
                if (inp) inp.placeholder = 'SELECIONAR LOTE';
                setPackingGuide('warn', 'SELECIONAR LOTE', 'Seleciona primeiro um lote ativo para começar o Packing.', []);
                return;
            }

            if (!scanData.id) {
                if (inp) inp.placeholder = 'PICAR ID';
                setPackingGuide('', '1. PICAR ID', 'Pica o ID da encomenda. Só depois o sistema permite picar produtos.', batchPill);
                return;
            }

            if (packingCurrentIdIsCancelled()) {
                if (inp) inp.placeholder = 'ID CANCELADO - LIMPAR';
                setPackingGuide('bad', 'ID CANCELADO', 'Este ID está cancelado. Carrega em CLEAR SCAN e pica outro ID.', [`ID: ${scanData.id}`, ...batchPill]);
                return;
            }

            const chk = packingMeetsExpected();
            const requiredVols = getPackingRequiredVolumes();
            const gotTracks = getPackingScannedVolumes();
            const basePills = [`ID: ${scanData.id}`, `Produtos picados: ${(scanData.prods || []).length}`, `Tracking: ${gotTracks}/${requiredVols}`, ...batchPill];

            if (chk.extra && chk.extra.length) {
                if (inp) inp.placeholder = 'REMOVER PRODUTO ERRADO';
                setPackingGuide('bad', 'PRODUTO EXTRA / DIFERENTE', `Não podes fechar este ID. Remove no botão <b>×</b> o produto que não pertence ao pedido.<br><br><b>Extra/diferente:</b> ${chk.extra.join(', ')}`, basePills);
                return;
            }

            if (chk.missing && chk.missing.length) {
                if (inp) inp.placeholder = 'PICAR PRODUTOS';
                setPackingGuide('warn', '2. PICAR PRODUTOS', `Pica os produtos deste ID. Ainda falta:<br><b>${chk.missing.join('<br>')}</b>`, basePills);
                return;
            }

            if (!scanData.track || gotTracks < requiredVols) {
                if (inp) inp.placeholder = requiredVols > 1 ? `PICAR TRACKING ${gotTracks + 1}/${requiredVols}` : 'PICAR TRACKING';
                setPackingGuide('ok', '3. PICAR TRACKING', requiredVols > 1 ? `Produtos certos. Agora pica todos os volumes/trackings deste ID. Podem ser iguais ou diferentes. Faltam ${requiredVols - gotTracks}.` : 'Produtos certos. Agora pica o tracking. O ID fecha automaticamente depois do tracking.', basePills);
                return;
            }

            if (inp) inp.placeholder = 'A FECHAR ID...';
            setPackingGuide('done', 'ID A FECHAR AUTOMATICAMENTE', 'Produtos e tracking corretos. O sistema vai concluir este ID automaticamente.', basePills);
        }

        function refreshConfirmBtn() {
            const btn = document.getElementById('btn-confirm-order');
            if (!btn) return;

            if ((currentMode || 'PACKING') === 'PACKING') {

                btn.style.display = 'none';
                const volEl = document.getElementById('v-volumes-status');
                if (volEl) {
                    const requiredVols = getPackingRequiredVolumes();
                    const gotTracks = getPackingScannedVolumes();
                    if (scanData.id && requiredVols > 1) {
                        volEl.style.display = 'block';
                        volEl.innerHTML = `<b>Volumes:</b> ${gotTracks}/${requiredVols} leituras de tracking picadas`;
                        volEl.style.color = gotTracks >= requiredVols ? '#166534' : '#b45309';
                    } else {
                        volEl.style.display = 'none';
                    }
                }
                updatePackingGuidance();
                return;
            }

            if (scanData.id && scanData.track) {
                btn.style.display = 'block';
            } else {
                btn.style.display = 'none';
            }
        }

        async function handlePackingScan(rawValue) {
            const v = String(rawValue || '').trim();
            if (!v) { updatePackingGuidance(); return; }

            if (!activeBatchData || !document.getElementById('wh-batch-select').value) {
                updatePackingGuidance();
                alert('Seleciona primeiro um lote ativo.');
                return;
            }

            const key = safeKey(v);
            const isProduct = !!masterProductsDB[key];
            const isOrderId = /^\d{8}$/.test(v);

            if (isOrderId) {
                if (scanData.id) {
                    alert(`Termina primeiro o ID atual (${scanData.id}). Se precisares, carrega em CLEAR SCAN.`);
                    updatePackingGuidance();
                    return;
                }
                if (!packingIdBelongsToBatch(v)) {
                    alert(`ID ${v} não pertence ao lote selecionado. Confirma o lote antes de continuar.`);
                    updatePackingGuidance();
                    return;
                }

                if (activeBatchData && activeBatchData.processed_ids && activeBatchData.processed_ids[v]) {
                    showPackingErrorModal(
                        'ID JÁ PROCESSADO',
                        'O ID ' + v + ' já foi concluído neste lote.',
                        'Este ID já consta na lista de IDs picados. Passa ao próximo ID.',
                        'warn'
                    );
                    updatePackingGuidance();
                    return;
                }
                scanData.startTime = _nowTime();
                scanData.startTs = Date.now();
                scanData.id = v;
                showMetadata(v);
                updateDisplay('PACKING');
                refreshConfirmBtn();
                return;
            }

            if (isProduct) {
                if (!scanData.id) {
                    alert('Primeiro tens de picar o ID.');
                    updatePackingGuidance();
                    return;
                }
                if (packingCurrentIdIsCancelled()) {
                    alert('Este ID está cancelado. Limpa a picagem e passa ao próximo ID.');
                    updatePackingGuidance();
                    return;
                }
                if (scanData.track) {
                    alert('O tracking já foi picado. Aguarda a conclusão automática ou limpa a picagem.');
                    updatePackingGuidance();
                    return;
                }
                scanData.prods.push(masterProductsDB[key]);
                updateDisplay('PACKING');
                refreshConfirmBtn();
                const chkAfterProduct = packingMeetsExpected();
                if (chkAfterProduct.extra && chkAfterProduct.extra.length) {
                    showPackingProductError(chkAfterProduct, 'extra');
                    return;
                }
                await autoCompletePackingIfReady();
                return;
            }

            if (!scanData.id) {
                alert('Primeiro tens de picar o ID.');
                updatePackingGuidance();
                return;
            }
            if (packingCurrentIdIsCancelled()) {
                alert('Este ID está cancelado. Limpa a picagem e passa ao próximo ID.');
                updatePackingGuidance();
                return;
            }
            const chk = packingMeetsExpected();
            if (chk.extra && chk.extra.length) {
                showPackingProductError(chk, 'extra');
                updatePackingGuidance();
                return;
            }
            if (chk.missing && chk.missing.length) {
                showPackingProductError(chk, 'missing');
                updatePackingGuidance();
                return;
            }
            if (!scanData.tracks) scanData.tracks = [];
            const requiredVols = getPackingRequiredVolumes();
            if (scanData.tracks.length >= requiredVols) {
                alert(`Este ID só precisa de ${requiredVols} volume(s) / tracking(s). Não piques tracking extra.`);
                updatePackingGuidance();
                return;
            }

            scanData.tracks.push(v);
            scanData.track = scanData.tracks[0];
            updateDisplay('PACKING');
            refreshConfirmBtn();
            await autoCompletePackingIfReady();
        }

        async function autoCompletePackingIfReady() {
            if ((currentMode || '') !== 'PACKING') return;
            if (scanData._autoCompleting) return;
            if (!scanData.id || !scanData.track) { updatePackingGuidance(); return; }
            if (packingCurrentIdIsCancelled()) { updatePackingGuidance(); return; }
            const chk = packingMeetsExpected();
            const requiredVols = getPackingRequiredVolumes();
            const gotTracks = getPackingScannedVolumes();
            if (chk.ok && gotTracks >= requiredVols) {
                scanData._autoCompleting = true;
                updatePackingGuidance();
                try {
                    await confirmOrder('PACKING', { auto: true });
                } finally {
                    if (scanData && scanData._autoCompleting) scanData._autoCompleting = false;
                }
            } else {
                updatePackingGuidance();
            }
        }

        function handleScan(v, mode) {
            const m = mode || currentMode;
            if ((m || '').toString().toUpperCase() === 'PACKING') {
                handlePackingScan(v);
                return;
            }
            const key = safeKey(v);
            if (masterProductsDB[key]) {
                const prodName = masterProductsDB[key]; scanData.prods.push(prodName);
            } else if (/^\d{8}$/.test(v)) {

                if (!scanData.id) { scanData.startTime = _nowTime(); scanData.startTs = Date.now(); }
                scanData.id = v; if (m === 'PACKING') showMetadata(v);
            } else {

                if (!scanData.tracks) scanData.tracks = [];
                if (!scanData.tracks.includes(v)) {
                    scanData.tracks.push(v);
                }
                scanData.track = scanData.tracks[0];
            }
            updateDisplay(m);
            refreshConfirmBtn();

            if (_isReturnMode(m) || _isRefundMode(m)) {
                updateReturnRefundStatus(m);

                if (scanData.id) {
                    checkAndShowPartialBanner(m);
                    maybeShowReturnRefundPartialBlock(m);
                }
            }
        }

        function _isExcludedFromReturn(prodName) {
            const n = (prodName || '').toString().toUpperCase().trim();
            return n === 'WARRANTY PT' || n === 'WARRANTY ES' ||
                n.startsWith('WARRANTY PT ') || n.startsWith('WARRANTY ES ');
        }

        async function checkReturnVsPacking(orderId, scannedProds) {
            if (!orderId) return { found: false, match: false, packedProds: [], packedRelevant: [], missingProds: [], extraProds: [] };
            try {
                const snap = await db.ref('registos').orderByChild('id').equalTo(orderId).once('value');
                const recs = snap.val();
                if (!recs) return { found: false, match: false, packedProds: [], packedRelevant: [], missingProds: [], extraProds: [] };

                let packRec = null;
                Object.values(recs).forEach(r => {
                    if (!r || (r.mode || '').toString().toUpperCase() !== 'PACKING') return;
                    if (!packRec || (r.ts || 0) > (packRec.ts || 0)) packRec = r;
                });

                if (!packRec) return { found: false, match: false, packedProds: [], packedRelevant: [], missingProds: [], extraProds: [] };

                const packedRaw = (packRec.prods || '').split(' | ').map(p => p.trim().toUpperCase()).filter(Boolean);

                const packedRelevant = packedRaw.filter(p => !_isExcludedFromReturn(p));

                const scannedNorm = (scannedProds || []).map(p => p.trim().toUpperCase()).filter(p => p && !_isExcludedFromReturn(p));

                const countPacked = {};
                packedRelevant.forEach(p => { countPacked[p] = (countPacked[p] || 0) + 1; });
                const countScanned = {};
                scannedNorm.forEach(p => { countScanned[p] = (countScanned[p] || 0) + 1; });

                const allKeys = new Set([...Object.keys(countPacked), ...Object.keys(countScanned)]);
                const missingProds = [];
                const extraProds = [];

                allKeys.forEach(k => {
                    const need = countPacked[k] || 0;
                    const got = countScanned[k] || 0;
                    if (got < need) missingProds.push(`${k} (${got}/${need})`);
                    if (got > need) extraProds.push(`${k} (extra: ${got - need})`);
                });

                const match = missingProds.length === 0 && extraProds.length === 0;
                return { found: true, match, packedProds: packedRaw, packedRelevant, missingProds, extraProds };
            } catch (e) {
                console.warn('checkReturnVsPacking error', e);
                return { found: false, match: false, packedProds: [], packedRelevant: [], missingProds: [], extraProds: [] };
            }
        }

        function getReturnRefundCompareProds() {

            const prev = (scanData && Array.isArray(scanData._prevIncompleteProds)) ? scanData._prevIncompleteProds : [];
            const current = (scanData && Array.isArray(scanData.prods)) ? scanData.prods : [];
            return [...prev, ...current];
        }

        function hasCurrentReturnRefundProducts() {
            const current = (scanData && Array.isArray(scanData.prods)) ? scanData.prods : [];
            return current.some(p => String(p || '').trim() && String(p || '').trim() !== 'No Items');
        }

        function _returnRefundRelevantCounts(list) {
            const counts = {};
            const arr = Array.isArray(list) ? list : String(list || '').split('|');
            arr.forEach(function (p) {
                const k = String(p || '').trim().toUpperCase();
                if (!k || k === 'NO ITEMS' || _isExcludedFromReturn(k)) return;
                counts[k] = (counts[k] || 0) + 1;
            });
            return counts;
        }

        function _returnRefundCountsToList(counts) {
            return Object.keys(counts || {}).sort().map(function (k) {
                return k + ' x' + (counts[k] || 0);
            });
        }

        function buildReturnRefundAlreadyScannedMessage(result) {
            const bad = (result && result.bad) ? result.bad : [];
            const allowed = (result && result.allowed) ? result.allowed : [];
            let msg = 'Este ID ja tinha produtos picados num fecho anterior (INCOMPLETO ou botao especial).\n\n';
            msg += 'Nesta nova picagem so podes picar apenas os produtos/quantidades que ficaram em falta.\n\n';
            if (bad.length) {
                msg += 'Produto/quantidade ja picado anteriormente ou acima do que falta:\n';
                bad.forEach(function (x) {
                    msg += '- ' + x.product + ': picado agora ' + x.current + ', falta apenas ' + x.remaining + ' (ja tinha ' + x.previous + ' de ' + x.expected + ')\n';
                });
                msg += '\n';
            }
            if (allowed.length) {
                msg += 'Ainda podes picar:\n- ' + allowed.join('\n- ') + '\n\n';
            } else {
                msg += 'Neste momento nao ha produtos em falta para este ID.\n\n';
            }
            msg += 'Remove o produto errado no botao X antes de fechar como COMPLETO, INCOMPLETO ou com botao especial.';
            return msg;
        }

        async function checkReturnRefundOnlyRemainingProducts(mode, opts) {
            const m = mode || currentMode;
            if (!scanData || !scanData.id) return { ok: true };
            if (!hasCurrentReturnRefundProducts()) return { ok: true };
            if (!opts || opts.skipRefresh !== true) await refreshPreviousIncompleteProducts(m);

            const prev = (scanData && Array.isArray(scanData._prevIncompleteProds)) ? scanData._prevIncompleteProds : [];
            if (!prev.length) return { ok: true };

            const packOnly = await checkReturnVsPacking(scanData.id, []);
            if (!packOnly || !packOnly.found) return { ok: true };

            const packedCounts = _returnRefundRelevantCounts(packOnly.packedRelevant || packOnly.packedProds || []);
            const prevCounts = _returnRefundRelevantCounts(prev);
            const currentCounts = _returnRefundRelevantCounts(scanData.prods || []);

            const allowed = [];
            Object.keys(packedCounts).sort().forEach(function (k) {
                const remaining = Math.max(0, (packedCounts[k] || 0) - (prevCounts[k] || 0));
                if (remaining > 0) allowed.push(k + ' x' + remaining);
            });

            const bad = [];
            Object.keys(currentCounts).sort().forEach(function (k) {
                const expected = packedCounts[k] || 0;
                const previous = prevCounts[k] || 0;
                const remaining = Math.max(0, expected - previous);
                const current = currentCounts[k] || 0;
                if (current > remaining) {
                    bad.push({ product: k, current: current, remaining: remaining, previous: previous, expected: expected });
                }
            });

            if (!bad.length) return { ok: true, allowed: allowed, check: packOnly };
            const result = { ok: false, bad: bad, allowed: allowed, packedCounts: packedCounts, prevCounts: prevCounts, currentCounts: currentCounts, check: packOnly };
            result.message = buildReturnRefundAlreadyScannedMessage(result);
            return result;
        }

        async function maybeShowReturnRefundPartialBlock(mode) {
            const res = await checkReturnRefundOnlyRemainingProducts(mode);
            if (!scanData) return res;
            if (!res || res.ok) {
                scanData._lastReturnRefundPartialBlockKey = '';
                return res;
            }
            const key = JSON.stringify((res.bad || []).map(function (x) { return [x.product, x.current, x.remaining, x.previous, x.expected]; }));
            if (scanData._lastReturnRefundPartialBlockKey !== key) {
                scanData._lastReturnRefundPartialBlockKey = key;
                showReturnRefundBlockModal('PRODUTO JA PICADO', res.message);
            }
            return res;
        }

        function buildReturnRefundBlockMessage(check, closeType) {
            let msg = `Não é possível fechar este ${closeType || 'registo'}.`;
            if (check && check.extraProds && check.extraProds.length) {
                msg += `

Produtos DIFERENTES / EXTRA vs Packing:
- ${check.extraProds.join('\n- ')}`;
                msg += `

Apaga o produto errado no botão × e pica apenas produtos que existiam no Packing.`;
            }
            if (check && check.missingProds && check.missingProds.length) {
                msg += `

Faltam produtos do Packing:
- ${check.missingProds.join('\n- ')}`;
            }
            return msg;
        }

        async function validateReturnRefundBeforeClose(mode, status) {
            const m = mode || currentMode;
            const st = (status || '').toString().toUpperCase();

            if (!scanData.id || !scanData.track) {
                return { ok: false, message: 'Faltam dados (ID e tracking)!' };
            }

            if (!hasCurrentReturnRefundProducts()) {
                return { ok: false, message: 'Tens de picar pelo menos 1 produto antes de fechar como COMPLETO ou INCOMPLETO.' };
            }

            await refreshPreviousIncompleteProducts(m);
            const remainingCheck = await checkReturnRefundOnlyRemainingProducts(m, { skipRefresh: true });
            if (remainingCheck && !remainingCheck.ok) {
                return { ok: false, check: remainingCheck.check, message: remainingCheck.message };
            }
            const check = await checkReturnVsPacking(scanData.id, getReturnRefundCompareProds());

            if (!check.found) return { ok: true, check };

            if (check.extraProds && check.extraProds.length) {
                return { ok: false, check, message: buildReturnRefundBlockMessage(check, st === 'COMPLETE' ? 'como COMPLETO' : 'como INCOMPLETO') };
            }

            if (st === 'COMPLETE' && check.missingProds && check.missingProds.length) {
                let msg = buildReturnRefundBlockMessage(check, 'como COMPLETO');
                msg += '\n\nSe os produtos não voltaram todos, fecha como INCOMPLETO.';
                return { ok: false, check, message: msg };
            }

            return { ok: true, check };
        }

        async function refreshPreviousIncompleteProducts(mode) {
            if (!scanData || !scanData.id) {
                if (scanData) scanData._prevIncompleteProds = [];
                return [];
            }
            const result = await checkExistingIncomplete(scanData.id, mode);
            scanData._prevIncompleteProds = (result && result.found) ? (result.allPrevProds || []) : [];
            return scanData._prevIncompleteProds;
        }

        function _renderPackedProdsHtml(packedProds) {
            if (!packedProds || packedProds.length === 0) return '';
            const relevantCount = packedProds.filter(p => !_isExcludedFromReturn(p)).length;
            const tags = packedProds.map(p => {
                const clean = _fmt(p);
                const excluded = _isExcludedFromReturn(clean);
                const bg = excluded ? '#f1f5f9' : '#dbeafe';
                const color = excluded ? '#64748b' : '#1e40af';
                const border = excluded ? '#cbd5e1' : '#60a5fa';
                const note = excluded ? '<div style="font-size:11px; opacity:0.8; margin-top:2px;">excluído da comparação</div>' : '';
                return `<div style="background:${bg}; color:${color}; border:1px solid ${border}; padding:10px 12px; border-radius:10px; font-size:15px; font-weight:900; margin:4px 0; line-height:1.25; word-break:break-word;">${clean}${note}</div>`;
            }).join('');
            return `
            <div style="margin-top:12px; background:#eff6ff; border:2px solid #bfdbfe; border-radius:14px; padding:12px; color:#1e3a8a;">
                <div style="font-size:16px; font-weight:1000; margin-bottom:4px;">📦 PRODUTOS EMBALADOS EM PACKING</div>
                <div style="font-size:13px; font-weight:800; color:#475569; margin-bottom:8px;">${relevantCount} produto${relevantCount !== 1 ? 's' : ''} relevante${relevantCount !== 1 ? 's' : ''} para comparar</div>
                <div>${tags}</div>
            </div>`;
        }

        async function checkExistingIncomplete(orderId, mode) {
            if (!orderId) return { found: false, records: [], allPrevProds: [], latestRec: null };
            try {
                const snap = await db.ref('registos').orderByChild('id').equalTo(orderId).once('value');
                const recs = snap.val();
                if (!recs) return { found: false, records: [], allPrevProds: [], latestRec: null };

                const isRet = _isReturnMode(mode);
                const isRef = _isRefundMode(mode);
                const matched = [];

                Object.entries(recs).forEach(([k, r]) => {
                    if (!r) return;
                    const m = (r.mode || '').toString().toUpperCase();
                    if (isRet && !_isReturnMode(m)) return;
                    if (isRef && !_isRefundMode(m)) return;
                    const st = (r.returnStatus || '').toString().toUpperCase();
                    const isIncomplete = st === 'INCOMPLETE';
                    const isRefundSpecialWithProducts = isRef && r.specialCloseWithProducts === true &&
                        ['SWIPE', 'NO_PRODUCT', 'PRODUCT_DAMAGED', 'BOX_DAMAGED', 'NO_PRODUCT_DAMAGED'].includes(st);
                    if (!isIncomplete && !isRefundSpecialWithProducts) return;
                    matched.push({ key: k, ...r, _lockReason: isIncomplete ? 'INCOMPLETE' : 'SPECIAL_REFUND' });
                });

                if (!matched.length) return { found: false, records: [], allPrevProds: [], latestRec: null };

                matched.sort((a, b) => (a.ts || 0) - (b.ts || 0));

                const allPrevProds = [];
                matched.forEach(r => {
                    const prods = (r.prods || '').split(' | ').map(p => p.trim()).filter(Boolean);
                    prods.forEach(p => { if (p && p !== 'No Items') allPrevProds.push(p); });
                });

                const latestRec = matched[matched.length - 1];
                return { found: true, records: matched, allPrevProds, latestRec };
            } catch (e) {
                console.warn('checkExistingIncomplete error', e);
                return { found: false, records: [], allPrevProds: [], latestRec: null };
            }
        }

        async function autoFinishBatchPackingIfCompleteAfterId(bId, justPackedId) {
            if (!bId || !activeBatchData) return false;
            const requiredIds = getRequiredBatchIds(activeBatchData);
            const processedMap = Object.assign({}, activeBatchData.processed_ids || {});
            if (justPackedId) processedMap[justPackedId] = true;
            const missing = requiredIds.filter(id => !processedMap[id]);
            if (missing.length > 0) return false;

            const batchName = activeBatchData.name || bId;
            await db.ref('active_batches/' + bId).update({
                status: 'COMPLETED',
                completedBy: currentUser && currentUser.email ? currentUser.email.split('@')[0].toUpperCase() : 'SYSTEM',
                completedAt: _nowDateTime(),
                completedTs: Date.now()
            });
            try { await logBatchAction(bId, 'BATCH COMPLETED AUTOMATICALLY'); } catch (e) { console.warn('auto batch log failed', e); }

            try { if (activeBatchPath) db.ref(activeBatchPath).off(); } catch (e) { console.warn(e); }
            try { if (__processedRegRef && __processedRegCb) __processedRegRef.off('value', __processedRegCb); } catch (e) { console.warn(e); }
            __processedRegRef = null;
            __processedRegCb = null;

            localStorage.removeItem('lastPackingBatch');
            const sel = document.getElementById('wh-batch-select');
            if (sel) sel.value = '';
            activeBatchData = null;
            activeBatchPath = null;

            try { syncGlobalData(); } catch (e) { console.warn(e); }

            setTimeout(() => showPackingCompleteModal(batchName), 80);
            return true;

        function overviewBatchIsReadyToAutoComplete(batch) {
            if (!batch || batch.status === 'COMPLETED') return false;

            if (batch.status !== 'READY_TO_PACK') return false;
            const requiredIds = getRequiredBatchIds(batch);
            if (!requiredIds.length) return false;
            const processedMap = batch.processed_ids || {};
            const missing = requiredIds.filter(id => !processedMap[id]);

        async function confirmOrder(mode, opts) {
            const m = mode || currentMode;
            const bId = document.getElementById('wh-batch-select').value;
            if (!scanData.id || !scanData.track) return alert("Faltam dados!");

            if (_isReturnMode(m) || _isRefundMode(m)) {
                const validation = await validateReturnRefundBeforeClose(m, 'COMPLETE');
                if (!validation.ok) return alert(validation.message);
            }

            if (m === 'PACKING') {
                const chk = packingMeetsExpected();
                if (!chk.ok) {
                    let msg = "ERRO: não é possível completar este ID.";
                    if (chk.missing && chk.missing.length) {
                        msg += "\n\nFaltam picar itens deste ID:\n- " + chk.missing.join("\n- ");
                    }
                    if (chk.extra && chk.extra.length) {
                        msg += "\n\nProdutos EXTRA picados neste ID:\n- " + chk.extra.join("\n- ");
                        msg += "\n\nRemove/reinicia a picagem deste ID e pica apenas os produtos esperados.";
                    }
                    showPackingProductError(chk, 'confirm');
                    return;
                }

                const requiredVols = getPackingRequiredVolumes();
                const gotTracks = getPackingScannedVolumes();
                if (gotTracks < requiredVols) {
                    showPackingErrorModal(
                        'FALTAM TRACKINGS',
                        `Este ID tem ${requiredVols} volume(s).\nTrackings picados: ${gotTracks}/${requiredVols}.\nAinda falta(m): ${requiredVols - gotTracks}.`,
                        'Picar todos os trackings/volumes antes de fechar',
                        'warn'
                    );
                    return;
                }
            }

            const workDc = _nowDateClean();
            const endTime = _nowTime();
            const endTs = Date.now();

            let dc = workDc;

            try {
                if (m === 'PACKING' && bId) {

                    let batchDc = (activeBatchData && activeBatchData.dateClean) ||
                        (__overviewCacheBatches && __overviewCacheBatches[bId] && __overviewCacheBatches[bId].dateClean) ||
                        '';

                    if (!batchDc) {
                        const dSnap = await db.ref(`active_batches/${bId}/dateClean`).once('value');
                        batchDc = dSnap.val() || '';
                    }
                    if (batchDc) dc = batchDc;

                    await db.ref(`active_batches/${bId}/processed_ids/${scanData.id}`).set(true);
                    logBatchAction(bId, `PACKED ID: ${scanData.id}`);
                }

                const allTracks = (scanData.tracks && scanData.tracks.length > 0) ? scanData.tracks : [scanData.track];
                const returnStatusField = (_isReturnMode(m) || _isRefundMode(m)) ? { returnStatus: 'COMPLETE' } : {};
                const _prevProdsForComplete = ((_isReturnMode(m) || _isRefundMode(m)) && scanData._prevIncompleteProds && scanData._prevIncompleteProds.length)
                    ? { prevProds: scanData._prevIncompleteProds.join(' | '), allProds: [...(scanData._prevIncompleteProds), ...scanData.prods].join(' | ') }
                    : {};
                const recordPayload = {
                    id: scanData.id,
                    track: allTracks[0],
                    tracks: allTracks.join(' | '),
                    volumes: allTracks.length,
                    prods: scanData.prods.join(' | ') || 'No Items',
                    mode: m,
                    ...returnStatusField,
                    ..._prevProdsForComplete,
                    batch: bId || 'GENERAL',
                    user: currentUser.email.split('@')[0].toUpperCase(),
                    startTime: scanData.startTime || endTime,
                    endTime: endTime,
                    startTs: (typeof scanData.startTs === 'number') ? scanData.startTs : null,

                    time: endTime,

                    dateClean: dc,
                    DateTime: _dtKey(dc, endTime),

                    workDateClean: workDc,
                    workDateTime: _dtKey(workDc, endTime),

                    ts: Date.now()
                };
                const regRef = await db.ref('registos').push(recordPayload);
                await whSheetsSendReturnRefundRecord(regRef.key, recordPayload);

                let __packingBatchAutoCompleted = false;
                if (m === 'PACKING' && bId) {
                    __packingBatchAutoCompleted = await autoFinishBatchPackingIfCompleteAfterId(bId, scanData.id);
                }

                resetScan();
                if (__packingBatchAutoCompleted) updatePackingGuidance();

        var searchCache = { ids: [], eventsById: {}, summaryById: {}, activeId: null };

        function _fmt(val) { return (val === undefined || val === null) ? "" : String(val); }

        function _nowDateClean() {
            return new Date().toISOString().slice(0, 10);
        }

        function _nowTime() {

            return new Intl.DateTimeFormat('pt-PT', {
                hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
            }).format(new Date());
        }

        function _dtKey(dateClean, timeStr) {
            return (_fmt(dateClean) + " " + _fmt(timeStr)).trim();
        }

        const _pickingInfoCache = {};
        async function getPickingInfo(batchId) {
            if (!batchId) return null;
            if (_pickingInfoCache[batchId]) return _pickingInfoCache[batchId];
            try {
                const snap = await db.ref('registos').orderByChild('batch').equalTo(batchId).once('value');
                let best = null;
                Object.values(snap.val() || {}).forEach(r => {
                    if (r && (r.mode === "PICKING" || r.msg === "PICKING COMPLETE")) {
                        const ts = (typeof r.ts === 'number') ? r.ts : 0;
                        if (!best || ts > (best.ts || 0)) best = r;
                    }
                });
                if (best) {
                    _pickingInfoCache[batchId] = { pickedBy: best.user, pickedAt: best.DateTime || _dtKey(best.dateClean, best.time), ts: best.ts || 0 };
                    return _pickingInfoCache[batchId];
                }
            } catch (e) {
                console.warn("getPickingInfo failed", e);
            }
            return null;
        }
        function _nowDateTime() {
            const dc = _nowDateClean();
            const tm = _nowTime();
            return _dtKey(dc, tm);
        }

        function _ptLocaleToDateTime(str) {

            const s = _fmt(str).trim();
            const m = s.match(/(\d{2})\/(\d{2})\/(\d{4}).*?(\d{2}):(\d{2})(?::(\d{2}))?/);
            if (!m) return "";
            const dd = m[1], mm = m[2], yyyy = m[3], hh = m[4], mi = m[5], ss = (m[6] || "00");
            return `${yyyy}-${mm}-${dd} ${hh}:${mi}:${ss}`;
        }

        function _normalizeDT(val, dateCleanFallback) {
            const s = _fmt(val).trim();
            if (!s) return "";

            if (/^\d{4}-\d{2}-\d{2}\s+\d{2}:\d{2}:\d{2}$/.test(s)) return s;

            const pt = _ptLocaleToDateTime(s);
            if (pt) return pt;

            if (/^\d{2}:\d{2}(:\d{2})?$/.test(s)) {
                const t = (s.length === 5) ? (s + ":00") : s;
                return _dtKey(dateCleanFallback || _nowDateClean(), t);
            }

            return s;
        }
        function _parseIds(raw) {
            return raw.split(/[\s,]+/).map(function (x) { return x.trim(); }).filter(function (x) { return x !== ""; });
        }

        function _getSearchFilters() {
            var s = document.getElementById('search-start-date');
            var e = document.getElementById('search-end-date');
            var t = document.getElementById('search-type-filter');
            var st = document.getElementById('search-status-filter');

            return {
                start: s ? s.value : "",
                end: e ? e.value : "",
                type: t ? t.value : "ALL",
                status: st ? st.value : "ALL"
            };
        }

        function _passesType(typeVal, filterVal) {
            if (!filterVal || filterVal === "ALL") return true;
            return typeVal === filterVal;
        }

        function _passesDate(dt, start, end) {

            if (!start && !end) return true;
            var d = _fmt(dt).slice(0, 10);
            if (start && d < start) return false;
            if (end && d > end) return false;
            return true;
        }

        function _renderTimeline(events) {
            var box = document.getElementById('id-history-timeline');
            if (!box) return;

            if (!events || !events.length) {
                box.innerHTML = "<div style='padding:12px; color:#666;'>No events for this filter.</div>";

            }

            var html = "<div style='position:relative; margin-left: 16px; border-left: 3px solid #e5e7eb; padding-left: 18px;'>";
            events.forEach(function (ev) {
                var type = _fmt(ev.Type);
                var dot = "var(--accent)";
                if (type === "PACKING") dot = "var(--packing)";
                if (type === "RETURNS") dot = "var(--returns)";
                if (type === "REFUNDS") dot = "var(--refunds)";
                if (type === "CANCELLED") dot = "var(--error)";
                if (type.indexOf("OFFICE") === 0) dot = "var(--primary)";

                html += "<div style='position:relative; margin: 14px 0;'>";
                html += "<div style='position:absolute; left:-28px; top: 8px; width:14px; height:14px; border-radius:999px; background:" + dot + "; box-shadow:0 0 0 4px rgba(0,0,0,0.06);'></div>";
                html += "<div style='background:white; border:1px solid #eee; border-radius:14px; padding:12px 14px; box-shadow: 0 3px 10px rgba(0,0,0,0.04);'>";
                html += "<div style='display:flex; justify-content:space-between; gap:10px; align-items:center;'>";
                html += "<div style='font-weight:900;'>" + type + "</div>";
                html += "<div style='font-size:12px; color:#666;'>" + _fmt(ev.DateTime) + "</div>";
                html += "</div>";
                var meta = [];
                if (_fmt(ev.Batch)) meta.push("<b>Batch:</b> " + _fmt(ev.Batch));
                if (_fmt(ev.Carrier)) meta.push("<b>Carrier:</b> " + _fmt(ev.Carrier));
                if (_fmt(ev.User)) meta.push("<b>User:</b> " + _fmt(ev.User));
                if (_fmt(ev.Tracking)) meta.push("<b>Track:</b> " + _fmt(ev.Tracking));
                if (_fmt(ev.Items_or_Content)) meta.push("<b>Items:</b> " + _fmt(ev.Items_or_Content));
                if (meta.length) html += "<div style='margin-top:8px; font-size:13px; line-height:1.35;'>" + meta.join(" &nbsp; | &nbsp; ") + "</div>";
                if (_fmt(ev.Details)) html += "<div style='margin-top:8px; font-size:12px; color:#444;'><small>" + _fmt(ev.Details) + "</small></div>";
                html += "</div>";
                html += "</div>";
            });
            html += "</div>";
            box.innerHTML = html;
        }

        function _renderSearchCards() {
            var container = document.getElementById('search-cards-container');

                    + "</div>";

                if (carrier) lines += "<div style='font-size:14px;'><b>Carrier:</b> " + carrier + "</div>";
                if (packedBy) lines += "<div style='font-size:14px;'><b>Packed by:</b> " + packedBy + "</div>";
                if (tracking) lines += "<div style='font-size:14px;'><b>Tracking:</b> " + tracking + "</div>";
                if (cancelReason) lines += "<div style='font-size:14px; color: var(--error);'><b>Cancel:</b> " + cancelReason + "</div>";
                if (last) lines += "<div style='margin-top:8px; font-size:12px; color:#666;'><b>Last event:</b> " + last + "</div>";

                var btns = "<div style='display:flex; gap:10px; margin-top:15px;'>"

                    + "</div>";

            if (!anyFound) {
                var note = document.createElement('div');
                note.className = "card";

        function _fillModalFiltersFromSearch() {
            var f = _getSearchFilters();
